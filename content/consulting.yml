# ============================================================
# 심플키 컨설팅 상세페이지 — 카피 v1 (2026-08-20 초안 기반)
# 이 파일이 "대표님 편집 영역"입니다. 카피·섹션 순서·여백(pad)을 여기서 바꾸고
# 저장하면 사이트가 자동으로 다시 만들어져요. 디자인·픽셀은 건드릴 수 없게 분리돼 있어요.
#
# pad(섹션 위아래 여백): xl(기본·넉넉) / lg(중간) / md(좁게) 셋 중에서만 선택
# bg(섹션 배경): white / warm(크림) / warm2(진한 크림) / dark(브라운) 중에서만 선택
# ============================================================
page:
  slug: consulting
  title: 심플키 · 대표가 없어도 굴러가는 회사를 만드는 위임 시스템 컨설팅
  description: 대표님이 없으면 회사가 멈추나요? 대표 머릿속 운영 방식을 직원과 AI가 그대로 따라 하는 시스템으로. 150개 기업 검증, 무료 진단.
  noindex: true   # 지영님 컨펌 전까지 검색 비노출 (컨펌 후 false로)

sections:
  - pattern: hero-a
    fields:
      eyebrow: 위임 시스템 컨설팅
      headline: 대표님이 없으면,<br>회사가 <span class="hl">멈추나요?</span>
      sub: 사무실 직원 1~10명, 매출은 나는데 대표님이 빠지면 멈추는 회사라면.<br>심플키가 대표님 머릿속에만 있던 운영 방식을, <b>직원과 AI가 그대로 따라 하는 시스템</b>으로 바꿔드립니다.
      cta: 10분 무료 상담 신청하기
      cta_href: "#booking"
      note: 형식적 영업 상담이 아니라, 대표가 직접 진단해요.

  - pattern: problem-a
    fields:
      eyebrow: Problem
      headline: 이 중 하나, 대표님 얘기 아닌가요?
      quotes:
        - text: 직원에게 맡겨도 결국 제가 다시 봐요
        - text: 노션은 쓰는데 정리가 안 돼요
        - text: 프리랜서랑 일하는데 인수인계가 너무 어려워요
        - text: 매출은 나는데 회사가 체계 없이 굴러가는 느낌이에요

  - pattern: agitate-b
    fields:
      eyebrow: Why
      headline: 대표님 잘못이 아니에요.
      tried:
        - 노션 템플릿도 사봤다
        - 컨설팅도 받아봤다
        - AI 강의도 들어봤다
      converge: 그런데 회사에 남은 게 별로 없죠. 전부 <span class="hl">완성된 결과물만</span> 받으셨을 뿐, 그걸 스스로 만드는 힘은 못 받으셨거든요. 그러니 여기서 또 하나 사는 건 답이 아니에요.

  - pattern: solution-a
    fields:
      eyebrow: Solution
      headline: 심플키는 AI를 도입하기 전에,<br>'AI가 일할 수 있는 환경'부터 만듭니다.
      body: 노션 깔고 끝, AI 몇 시간 교육하고 끝나면 회사는 안 바뀌어요. 정리 안 된 회사에 도구만 얹으면 혼란만 커지거든요. 심플키는 목표와 역할, 일하는 방식부터 잡고 그 위에 AI를 얹습니다. 결과물이 아니라 시스템 사고를 심어드리는 거예요.
      points:
        - num: "01"
          title: 판단 기준 꺼내기
          body: 대표님 머릿속에만 있던 기준과 운영 방식을 밖으로 꺼냅니다.
        - num: "02"
          title: 구조로 옮기기
          body: 꺼낸 기준을 역할·프로세스·시스템으로 옮깁니다.
        - num: "03"
          title: 팀이 그대로 따라 하기
          body: 직원과 AI가 대표님 방식 그대로 반복 실행합니다.

  - pattern: trust-a
    fields:
      eyebrow: Why SimpleKey
      headline: 가르치지 않아요. 시스템을 대신 깔아드리고,<br>대표님은 결과만 받으세요.
      story: 서지영 대표는 5인 스타트업부터 100인 기업까지 마케터, PM으로 일하며 <b>회사가 시스템 없이 무너지는 과정을 직접 봤어요.</b> 그 후 4년 넘게 150개 이상 기업의 운영을 시스템으로 바꿔온 경험을, 평생 써먹는 시스템 사고와 AI 활용법으로 전수해드립니다.
      name: 심플키 대표 서지영
      photo: /assets/founder.jpg

  - pattern: how-a
    fields:
      eyebrow: Process
      headline: 심플키만 따라오세요.
      sub: 대표 없이도 굴러가는 회사, 이 순서로 만듭니다.
      steps:
        - { num: "01", title: 비전·목표, body: 회사가 가야 할 방향과 우선순위부터 정합니다. }
        - { num: "02", title: 업무 역할, body: 사람과 AI의 역할을 나눕니다. 누가 무엇을 맡는지 명확하게. }
        - { num: "03", title: 프로세스, body: "반복 업무를 쪼개 누가 맡아도, AI가 맡아도 동일하게 만듭니다." }
        - { num: "04", title: 협업 시스템, body: 툴을 정리하고 업무가 한눈에 보이게 만듭니다. }
        - { num: "05", title: AI 자동화, body: 우선순위 업무부터 AI로 넘기고 노하우를 자산화합니다. }
        - { num: "06", title: 심플키 케어, body: 월 점검으로 시스템이 회사에 뿌리내릴 때까지 함께합니다. }

  - pattern: proof-a
    fields:
      eyebrow: Results
      headline: 이미 150개 이상 기업이 증명하고 있습니다.
      metrics:
        - { num: 월 6억, label: 단 3명으로 만든 매출, attr: A뷰티 커머스 · 김동민 대표 }
        - { num: 매출 3배, label: 매장 2배 확장, attr: 더즈 · 황시연 대표 }
        - { num: 효율 2배, label: 1.5개월 만에 달성, attr: 포케올데이 · 김영환 대표 (연 200억) }
        - { num: 매출 2.5배, label: 6개월 만에 성장, attr: 샐러디아 · 신태호 이사 (100호점+) }
        - { num: 3달 → 2주, label: 신입 교육 기간 단축, attr: 굿필마케팅 · 이혜림 대표 }
        - { num: 70%, label: 반복 업무 자동화, attr: 심플키 고객사 평균 }

  - pattern: offer-c
    fields:
      eyebrow: Offer
      headline: 심플키가 채워드리는 건 딱 이만큼입니다.
      sub: 회사에 필요한 조각만 골라 채워드려요. 다 만들어드리는 것도, 다 떠넘기는 것도 아니에요.
      items:
        - { num: 설계, title: 방향·역할 설계, body: 대표님과 함께 회사의 방향과 역할 구조를 설계합니다. }
        - { num: 구축, title: 시스템 세팅·실습, body: 실제 시스템을 세팅하고 팀이 손에 익도록 실습합니다. }
        - { num: 운영, title: 정착 점검, body: 시스템이 정착할 때까지 점검하고 다듬습니다. }
      note: 정확한 구성과 비용은 무료 진단에서 회사 상황에 맞게 안내드려요.

  - pattern: objection-a
    fields:
      eyebrow: Difference
      headline: 이런 생각, 하고 계시죠?
      col_label: 비교
      col_them: 다른 대안들
      col_us: 심플키
      rows:
        - { label: 코칭·강의, them: 생각과 마인드를 봐드려요, us: 그 일을 시스템으로 만들어 손을 떼게 해드려요 }
        - { label: 노션 템플릿, them: 완성된 틀을 드려요 (조금만 바뀌면 못 씀), us: 일을 꺼내고 쪼개고 위임하는 법을 장착해드려요. 툴은 껍데기 }
        - { label: AI 교육, them: "직접 배워서 쓰세요 (대표 손이 더 감)", us: "대신 깔아드리고, 대표님은 결과만 받으세요" }
      rebuttals:
        - q: 위임했는데 왜 자꾸 제가 다시 하게 되죠?
          a: 비전·역할·지표·프로세스가 없으면 위임해도 결국 대표님 일로 돌아와요. 심플키는 한 번 넘긴 일이 돌아오지 않는 구조를 먼저 만듭니다.

  - pattern: urgency-a
    fields:
      eyebrow: Limited
      headline: 대표가 직접 진단하는 자리라,
      big: 하루 2자리뿐입니다
      body: 형식적 상담이 아니라 서지영 대표가 직접 회사 상황을 듣고 진단해요. 그래서 하루에 받을 수 있는 자리가 정해져 있습니다.

  - pattern: cta-a
    fields:
      eyebrow: Free Diagnosis
      headline: 지금, 10분이면 됩니다.
      fit: 사무실 직원 1~10명, 매출은 나는데 내가 빠지면 멈추는 대표님을 위한 상담이에요. 하나라도 해당되면 신청하세요.
      checks:
        - 잘 파는 방법을 찾는 중이다
        - 일이 나한테 몰려서, 내가 없으면 안 돌아간다
        - 맡겨도 다시 챙기게 되고, 업무가 한눈에 안 보인다
        - 제품·브랜드를 늘리고 싶은데 복제가 안 된다
        - AI를 도입하고 싶은데 어디에 붙일지 모르겠다
      note: 진단은 무료예요. 진단 후 꼭 계약해야 하는 것도 아니에요.

  - pattern: faq-b
    fields:
      eyebrow: FAQ
      headline: 자주 묻는 질문
      items:
        - q: 1인 기업도 가능한가요?
          a: 오히려 좋아요. AI를 첫 직원으로 두고, 채용 전에 시스템부터 잡으면 잘못된 채용으로 수천만 원 날리는 것을 막을 수 있어요.
        - q: 다른 노션·AI 세팅 회사와 뭐가 다른가요?
          a: 툴만 세팅하지 않아요. 커리큘럼 전체가 대표님 목표 달성에 맞춰져 있어요. 경영 시스템을 먼저 잡고, 직원이 일 잘하는 법과 시스템 사고까지 익히게 설계했어요.
        - q: 직원이 툴을 몰라도 되나요?
          a: 네. 기초부터 응용까지 교육해요. 실제로 신입 교육 기간이 3개월에서 2주로 줄어든 곳도 있어요.
        - q: 시간과 비용은 얼마나 드나요?
          a: 회사 규모·문제·범위에 따라 달라요. 무료 진단에서 정확한 견적과 커리큘럼을 안내드려요.
        - q: 끝나면 흐지부지되지 않나요?
          a: 일회성 워크숍이 아니에요. 월 정기 자문으로 시스템 사고가 회사에 내재화될 때까지 함께해요.

  - pattern: final-a
    fields:
      eyebrow: Start Now
      headline: 지금 10분, 회사 성장을 막고 있는<br>문제를 무료로 진단받으세요.
      body: 150개 이상 기업이 이미 변했습니다. 대표가 직접 진단하는 자리라 시간대가 한정돼 있어요.
      stats:
        - { num: 150+, label: 함께한 기업 }
        - { num: 2배, label: 평균 업무 효율 }
        - { num: 70%, label: 반복 업무 자동화 }
      cta: 10분 무료 상담 신청하기
      cta_href: "#booking"
