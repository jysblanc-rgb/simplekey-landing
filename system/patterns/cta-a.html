<div class="container">
  {{#eyebrow}}<span class="eyebrow">{{eyebrow}}</span>{{/eyebrow}}
  <h2 class="sec-title">{{{headline}}}</h2>
  {{#fit}}<p class="sec-sub">{{{fit}}}</p>{{/fit}}
  <div class="fit-list">
    {{#checks}}
    <div class="fit-item"><span class="chk">✓</span><span>{{.}}</span></div>
    {{/checks}}
  </div>
  <div id="cal-embed"></div>
  {{#note}}<p class="btn-note">{{note}}</p>{{/note}}
</div>
