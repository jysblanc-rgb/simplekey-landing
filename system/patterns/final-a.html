<!-- meta: bg=dark pad=xl id=final -->
<!-- 13 FINAL · A 성과카드 재노출형 — 핵심 정량 성과 다시 + CTA. ★심플키 기본값 -->
<div class="container" style="text-align:center">
  {{#eyebrow}}<span class="eyebrow">{{eyebrow}}</span>{{/eyebrow}}
  <h2 class="sec-title">{{{headline}}}</h2>
  {{#body}}<p class="sec-sub">{{{body}}}</p>{{/body}}
  <div class="final-stats">
    {{#stats}}
    <div class="fs-item">
      <div class="fs-num">{{num}}</div>
      <div class="fs-label">{{label}}</div>
    </div>
    {{/stats}}
  </div>
  <div class="btn-row">
    <a class="btn" href="{{cta_href}}">{{cta}} →</a>
    {{#cta2}}<a class="btn-ghost" href="{{cta2_href}}">{{cta2}}</a>{{/cta2}}
  </div>
</div>
